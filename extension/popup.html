<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pop-header">
      <div class="pop-brand">
        <span class="pop-live"></span>
        <span class="pop-wordmark">Jackdaw</span>
      </div>
      <button id="theme" class="pop-icon" title="Dark mode" aria-label="Dark mode"></button>
    </header>
    <main id="body" class="pop-body">
      <div class="pop-skeleton">
        <div class="pop-sk-row"></div>
        <div class="pop-sk-row"></div>
        <div class="pop-sk-row"></div>
      </div>
    </main>
    <footer class="pop-footer">
      <span id="count" class="pop-count"></span>
      <a class="pop-link" href="https://www.microcenter.com" target="_blank" rel="noopener">Browse Micro Center</a>
    </footer>
    <script src="popup.js"></script>

</html>
