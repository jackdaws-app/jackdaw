<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jackdaw</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pop-header">
      <div class="pop-brand">
        <span class="pop-live"></span>
        <canvas class="pop-sky" aria-hidden="true"></canvas>
        <span class="pop-wordmark"
          ><i>J</i><i>a</i><i>c</i><i>k</i
          ><i>d</i><i>a</i><i>w</i></span
        >
      </div>
      <span class="pop-tools">
        <button id="settings" class="pop-icon" title="Contributing" aria-label="Contributing"></button>
        <button id="theme" class="pop-icon" title="Dark mode" aria-label="Dark mode"></button>
      </span>
    </header>
    <main id="body" class="pop-body">
      <div class="pop-skeleton">
        <div class="pop-sk-row"></div>
        <div class="pop-sk-row"></div>
        <div class="pop-sk-row"></div>
      </div>
    </main>
    <footer class="pop-footer">
      <span class="pop-foot-left">
        <span id="count" class="pop-count"></span>
        <button id="acct" class="pop-acct" hidden></button>
      </span>
      <a class="pop-link" href="https://www.microcenter.com" target="_blank" rel="noopener"
        ><span class="pop-link-text">Micro Center</span
        ><span class="pop-link-arrow" aria-hidden="true">→</span></a
      >
    </footer>

    <!-- Account sheet. Rises from the footer pill that opened it, and the two
         sign-in steps transform into one another rather than swapping. -->
    <div class="pop-sheet" id="sheet" hidden>
      <div class="pop-scrim" id="scrim"></div>
      <div class="pop-sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <button class="pop-sheet-grip" type="button" aria-label="Close" title="Close"></button>
        <div id="sheetBody"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
