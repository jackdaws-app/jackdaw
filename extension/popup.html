<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pop-header">
      <div class="pop-brand">
        <span class="pop-live"></span>
        <svg class="pop-flit" viewBox="8 2 76 96" fill="currentColor" aria-hidden="true">
          <g class="pop-flit-wings">
            <path
              d="M55 46.2 Q51 38 47.5 30.5 Q44.5 23.5 40.5 15.5 L38.6 21.5 L35.2 17.5 L34.6 24 L31.6 21.5 L32 28 L29.5 26.5 Q32.5 34 36 40.5 Q38.5 44.6 40 47.8 Z"
            />
            <path
              d="M55 53.8 Q51 62 47.5 69.5 Q44.5 76.5 40.5 84.5 L38.6 78.5 L35.2 82.5 L34.6 76 L31.6 78.5 L32 72 L29.5 73.5 Q32.5 66 36 59.5 Q38.5 55.4 40 52.2 Z"
            />
          </g>
          <path
            d="M31.5 47.6 L20 42.5 L21.8 45.8 L17.5 44.8 L19.6 48 L16.8 50 L19.6 52 L17.5 55.2 L21.8 54.2 L20 57.5 L31.5 52.4 Q30.6 50 31.5 47.6 Z"
          />
          <path
            d="M31 49.9 Q34 47.6 41 46.6 Q50 45.4 57 46.6 Q62.5 47.4 66.5 48.7 L74 49.9 L66.5 51.2 Q62.5 52.6 57 53.4 Q50 54.6 41 53.4 Q34 52.4 31 50.1 Z"
          />
        </svg>
        <span class="pop-wordmark"
          ><i style="--i: 0">J</i><i style="--i: 1">a</i><i style="--i: 2">c</i><i style="--i: 3">k</i
          ><i style="--i: 4">d</i><i style="--i: 5">a</i><i style="--i: 6">w</i></span
        >
      </div>
      <button id="theme" class="pop-icon" title="Dark mode" aria-label="Dark mode"></button>
    </header>
    <main id="body" class="pop-body">
      <div class="pop-skeleton">
        <div class="pop-sk-row"></div>
        <div class="pop-sk-row"></div>
        <div class="pop-sk-row"></div>
      </div>
    </main>
    <footer class="pop-footer">
      <span class="pop-foot-left">
        <span id="count" class="pop-count"></span>
        <button id="acct" class="pop-acct" hidden></button>
      </span>
      <a class="pop-link" href="https://www.microcenter.com" target="_blank" rel="noopener"
        ><span class="pop-link-text">Micro Center</span
        ><span class="pop-link-arrow" aria-hidden="true">→</span></a
      >
    </footer>

    <!-- Account sheet. Rises from the footer pill that opened it, and the two
         sign-in steps transform into one another rather than swapping. -->
    <div class="pop-sheet" id="sheet" hidden>
      <div class="pop-scrim" id="scrim"></div>
      <div class="pop-sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="pop-sheet-grip" aria-hidden="true"></div>
        <div id="sheetBody"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
