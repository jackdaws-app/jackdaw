name: CI

# The mechanical half only: does every file still parse, and does the backend still
# type-check. Nothing here judges design, motion, or copy — those are review's job,
# and CONVENTIONS.md is what they are judged against.
#
# GitHub-hosted runners, deliberately and permanently. Once this repository is public
# an approved fork's pull request executes its own code on the runner; on a self-hosted
# box that would be the maintainer's own machine, filesystem and credentials.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The checks themselves live in scripts/check.sh so that this workflow and
      # `npm test` cannot drift apart — a contributor runs the same three gates
      # locally that decide the check here.
      - name: Types, syntax, stylesheets
        run: npm test
