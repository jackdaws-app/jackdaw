name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

# Explicit permissions required by contributor-assistant/github-action
permissions:
  actions: write
  contents: write # required to write signatures to the cla-signatures branch of this repo
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          # Signatures are stored on a dedicated branch in this same repository.
          # Create the 'cla-signatures' branch before the first PR, or the action
          # will fail to write the signature file.
          branch: "cla-signatures"
          allowlist: DavidSensara,bot*
